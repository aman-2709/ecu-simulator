name: CI

on:
  push:
    branches: [master, modernization]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  test:
    name: Unit and characterization tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: pytest
        run: |
          set -o pipefail
          pytest --cov=ecu_simulator --cov-report=term-missing --cov-report=xml | tee pytest.log
          # Publish the summary and coverage total as annotations: readable through the
          # public API without a signed-in session, unlike logs and artifacts.
          summary=$(grep -E 'passed|failed|error' pytest.log | tail -1 | sed -E 's/^=+ *//; s/ *=+$//')
          total=$(grep -E '^TOTAL' pytest.log | tr -s ' ')
          echo "::notice title=pytest (Python ${{ matrix.python-version }})::${summary} | coverage ${total}"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  can-capabilities:
    # Records whether kernel-dependent integration tests (marker "vcan") can run on
    # this runner. Informational only in Phase 1: it never fails the workflow.
    name: Probe vcan and can_isotp on the runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load kernel modules and create vcan0
        # Each command is attempted independently and its outcome published as an
        # annotation so the result is visible through the public API. Never fails the job.
        run: |
          echo "::notice title=runner kernel::$(uname -r) ($(lsb_release -ds 2>/dev/null || cat /etc/os-release | head -1))"
          for cmd in "modprobe vcan" "modprobe can_isotp" "ip link add dev vcan0 type vcan" "ip link set up vcan0"; do
            if out=$(sudo $cmd 2>&1); then
              echo "::notice title=${cmd}::ok"
            else
              echo "::warning title=${cmd}::exit $? - ${out//$'\n'/ }"
            fi
          done
          ip -details link show vcan0 2>&1 | tr '\n' ' ' | sed 's/^/vcan0: /'; echo
      - name: Install can-utils
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq can-utils
      - name: Probe capabilities
        run: |
          python scripts/probe_can_capabilities.py --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/probe_can_capabilities.py --format json > can-capabilities.json
          echo "::notice title=can-capabilities::$(jq -c . can-capabilities.json)"
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: can-capabilities
          path: can-capabilities.json
