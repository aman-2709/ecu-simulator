[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ecu-simulator"
version = "0.1.0.dev0"
description = "Vehicle diagnostic ECU simulator for SocketCAN testbenches (OBD-II and UDS over ISO-TP)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Luis Alberto Benthin Sanguino" }]
maintainers = [{ name = "Amandeep Kirpalsingh" }]
keywords = ["automotive", "can", "socketcan", "iso-tp", "obd-ii", "uds", "iso14229", "simulator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]
# can-isotp 2.x drives the kernel CAN_ISOTP socket (docs/decisions/0001-isotp-binding.md).
# It is the only runtime dependency; raw CAN capture is left to candump.
dependencies = [
    "can-isotp>=2.0,<3",
    # Profile schema validation. See docs/decisions/0002-configuration-format-and-validation.md.
    "pydantic>=2.13,<3",
    # YAML 1.2 safe loading; rejects duplicate keys instead of silently keeping the last.
    "ruamel.yaml>=0.19,<0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
ecu-simulator = "ecu_simulator.cli:main"

[project.urls]
Homepage = "https://github.com/lbenthins/ecu-simulator"

[tool.hatch.build.targets.wheel]
packages = ["src/ecu_simulator"]
# The default profile ships inside the package so the console script finds it when installed.
artifacts = ["src/ecu_simulator/profiles/*.yaml"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "scripts", "setup_can.sh", "setup_vcan.sh", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true
asyncio_default_fixture_loop_scope = "function"
markers = [
    "vcan: needs a vcan0 SocketCAN interface and the can_isotp kernel module; skipped when unavailable",
    "hardware: needs physical CAN hardware and an ELM327 adapter; opt-in only, never run in CI",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Characterization tests are frozen at their Phase 0 form; long parametrize lines are deliberate.
"tests/**" = ["E501"]
# The last legacy module went with Phase 6; no production file needs an exemption.

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
# The lenient baseline existed for the untyped legacy modules, the last of which went
# with Phase 6. Every production package is covered by the strict overrides below; this
# stays as the default for anything added outside them until it is listed there too.
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "ecu_simulator.transport",
    "ecu_simulator.vehicle",
    "ecu_simulator.vehicle.*",
    "ecu_simulator.config",
    "ecu_simulator.config.*",
    "ecu_simulator.clock",
    "ecu_simulator.dtc",
    "ecu_simulator.dtc.*",
    "ecu_simulator.transport.*",
    "ecu_simulator.ecu",
    "ecu_simulator.ecu.*",
    "ecu_simulator.protocols",
    "ecu_simulator.protocols.*",
    "ecu_simulator.logging",
    "ecu_simulator.app",
    "ecu_simulator.cli",
]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
