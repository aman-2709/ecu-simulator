<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ECU Simulator · SocketCAN</title>
  <link rel="stylesheet" href="/control.css"><script src="/control.js" defer></script><script src="/live.js" defer></script>
</head>
<body>
<header><h1>ECU Simulator</h1><span>SocketCAN</span></header>
<nav aria-label="Workspace">
  <button id="sim-tab" aria-pressed="true" aria-controls="sim-panel">Simulator</button>
  <button id="live-tab" aria-pressed="false" aria-controls="live-panel">Live CAN</button>
</nav>
<main id="sim-panel">
  <section aria-labelledby="profile-heading">
    <h2 id="profile-heading">Profile editor</h2>
    <div class="row"><label>Profile<select id="profile"></select></label>
      <label>CAN interface<select id="interface"></select></label></div>
    <label>Working copy <textarea id="draft" spellcheck="false" rows="20"></textarea></label>
    <form id="save-form"><label>Profile name<input id="name" required></label><button>Save as</button></form>
  </section>
  <div class="right">
    <section aria-labelledby="run-heading"><h2 id="run-heading">Simulator</h2>
      <p role="status"><strong id="state">Connecting</strong> <span id="active"></span></p>
      <p id="run-error" role="alert"></p>
      <div class="actions"><button id="start" class="primary" disabled>Start ECU</button><button id="stop" disabled>Stop ECU</button></div>
    </section>
    <section aria-labelledby="tester-heading"><h2 id="tester-heading">UDS tester</h2>
      <label>Endpoint<select id="endpoint"></select></label>
      <form id="send-form"><label>Request bytes<input id="payload" value="19 02 FF" spellcheck="false" required></label>
        <button id="send" class="primary" disabled>Send</button></form>
      <div id="result" aria-live="polite" hidden><h3>Last exchange</h3><div id="request"></div><output id="raw"></output>
        <p id="decoded"></p><ul id="records"></ul></div>
    </section>
    <p id="notice" role="status"></p><p id="error" role="alert"></p>
  </div>
</main>
<main id="live-panel" hidden>
  <section aria-labelledby="capture-heading">
    <h2 id="capture-heading">Live CAN</h2>
    <div class="row"><label>Capture interface<select id="capture-interface"></select></label>
      <button class="primary" id="capture-toggle" disabled>Start capture</button>
      <span id="capture-status" role="status">Stopped</span></div>
    <div class="row">
      <div class="view-switch" aria-label="Frame view"><button id="trace-view" aria-pressed="true">Trace</button><button id="group-view" aria-pressed="false">By CAN ID</button></div>
      <label>Filter CAN ID<input id="can-filter" placeholder="e.g. 7E8" spellcheck="false"></label>
      <button id="capture-pause" disabled>Pause display</button>
    </div>
    <div id="frame-summary"></div>
    <p id="byte-legend" hidden><mark>Highlighted bytes</mark> changed since the previous frame with the same CAN ID and frame type.</p>
    <div id="frame-scroll" tabindex="0" aria-label="CAN frames"><table>
      <thead><tr id="frame-head"></tr></thead><tbody id="frame-rows"></tbody>
    </table></div>
  </section>
</main>
</body></html>
